name: PC Dashboard CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: pc-dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore PcDashboard.slnx --locked-mode -m:1
      - run: dotnet build PcDashboard.slnx --configuration Release --no-restore -m:1
      - run: dotnet run --project tests/PcDashboard.Tests --configuration Release --no-build
      - run: dotnet publish src/PcDashboard.Desktop --configuration Release --no-build --output artifacts/publish

name: Bug report
description: Report a reproducible PC Dashboard problem
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Reproduction and evidence
      description: Remove usernames, paths, inventory data, and other machine-specific details.
    validations:
      required: true
